[project]
name = "tandem-desk"
version = "0.1.0"
description = "A guarded multi-agent support assistant for a fictional bike-rental service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.147.0",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.16",
    "langgraph-checkpoint-postgres>=3.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "datasets>=5.1.0",
    "httpx>=0.28.1",
    "langchain-community<0.4",
    "langchain-text-splitters>=1.1.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "uvicorn>=0.54.0",
]
